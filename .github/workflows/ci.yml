name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The suite runs the TypeScript sources directly, which needs the
          # type stripping that is on by default from 22.18.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The shipped file must satisfy its own contract at its own defaults.
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
